[project]
name = "career-ai-api"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.1,<2",
    "fastapi>=0.161.1,<1",
    "psycopg[binary]>=3.3.6,<4",
    "pydantic-settings>=2.16.1,<3",
    "sqlalchemy>=2.1.6,<2.2",
    "uvicorn[standard]>=0.54.0,<1",
]

[dependency-groups]
dev = ["httpx>=0.28.1,<1", "pytest>=9.1.1,<10", "ruff>=0.17.2,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
